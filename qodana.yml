# Qodana configuration:
# https://www.jetbrains.com/help/qodana/qodana-yaml.html

version: "1.0"
linter: jetbrains/qodana-jvm-community:2026.2
projectJDK: "21"
profile:
  name: qodana.recommended

# Qodana's own workspace is generated analysis output, not repository source.
# Repository-source exclusions are forbidden by check_qodana_gate.py.
exclude:
  - name: All
    paths:
      - .qodana
