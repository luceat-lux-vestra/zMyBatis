name: Bug report
description: Report incorrect or unsafe zMyBatis behavior
title: "bug: "
labels:
  - "type:bug"
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observable incorrect behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest mapper/statement/input/IDE setup that reproduces the problem. Remove private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include exact IDE/plugin/database versions and relevant diagnostics.
