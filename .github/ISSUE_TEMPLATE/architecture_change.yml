name: Architecture / behavior change
description: Propose a contract, safety, compatibility, or architecture change
title: "design: "
labels:
  - "type:research"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: State the concrete correctness, safety, ownership, or compatibility problem.
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Existing authority
      description: Identify the current contract, Track, ADR, or product invariant that governs the change.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract
      description: Define behavior precisely enough to falsify with tests/evidence.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Required evidence
      description: List failure/recovery/regression/compatibility/adversarial proof required before acceptance.
    validations:
      required: true
