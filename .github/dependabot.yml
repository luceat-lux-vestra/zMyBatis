# Dependabot configuration:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# This is a private repository without GitHub Advanced Security, so Dependabot security alerts,
# the dependency graph, and dependency review are not available here - only version-update PRs
# run. That is a deliberate reason to keep those PRs reviewable rather than a reason to relax
# their review: daily, one-PR-per-dependency updates were pure noise with no compensating signal
# from GHAS, so this reconciles to weekly, grouped updates instead. This intentionally does not
# copy stale PR #55's Dependabot config verbatim - see the rationale below and issue #70.

version: 2
updates:

  # Gradle: the IntelliJ Platform Gradle Plugin, Kotlin, MyBatis, and the test/coverage stack.
  # A platform/IDE-version bump must clear `verifyPlugin` (the Plugin Verifier gate in
  # build.yml) before merging - see AGENTS.md section 4.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      gradle-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions are pinned to full commit SHAs (see .github/workflow-policy/check_pins.py);
  # Dependabot is what keeps the SHA and its trailing version comment in sync, so this ecosystem
  # stays enabled even though it otherwise only touches CI configuration.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github_actions"
    groups:
      github-actions:
        patterns:
          - "*"
