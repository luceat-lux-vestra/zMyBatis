# Negative fixture (R2): a read-only validation job (no write permissions
# anywhere) whose checkout step relies on the default `persist-credentials:
# true`, leaving a usable repository token in .git/config for the rest of the
# job with no justification. Must never validate clean - see test_policy.py.

name: bad-missing-persist-credentials
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Tests
        run: ./gradlew check
