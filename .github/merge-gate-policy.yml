# Canonical repository / merge-gate policy for zMyBatis-private.
#
# This is the single source of truth for "what must be true before main advances." It exists
# because a required-status-check list configured only in GitHub's branch protection UI has no
# history, no review, and can silently drift from what the workflows actually produce (a renamed
# job quietly stops being required; a job gated behind a path filter becomes a permanently
# pending check on PRs that don't touch that path). This file is version-controlled instead.
#
# Scope: this is the repository/CI trust-boundary policy owned by issue #59. It intentionally
# does not cover JetBrains Marketplace publication/version-provenance policy, which belongs to
# the separate release-provenance track (issue #56) once that lands.
#
# Applying this to live branch protection is a separate, explicit repository-admin action (a
# `gh api` call against /repos/.../rulesets or branch protection) - this file documents the
# intended policy; it does not itself change GitHub settings. `main` currently has no branch
# protection configured live; reconciling that is tracked as follow-up under #59, not silently
# done by this file's presence.

version: 1

mergeStrategy:
  # squash-only: the linear history and single-commit-per-PR shape is what makes "review applies
  # to one exact final HEAD SHA" (see AGENTS.md) a meaningful, checkable statement after merge.
  allowed: [ squash ]
  requireBranchUpToDate: true
  requireLinearHistory: true

# Every entry here must name a job whose `name:` (not its job id) is what GitHub records as the
# status-check context, and that job must run unconditionally for every ordinary pull_request
# targeting main - no `if:` guard that can skip it, and no `paths`/`paths-ignore` filter on that
# workflow's `pull_request:` trigger. A required context that can legitimately not run leaves an
# indefinitely pending, unmergeable PR. `check_required_contexts.py` enforces the first part of
# that invariant (the job actually exists and matches); the absence of path filters on `build.yml`
# and `workflow-lint.yml`'s `pull_request:` triggers is verified by inspection and must be kept
# true by any future edit to those triggers.
requiredStatusChecks:
  - context: Build
    producedBy: .github/workflows/build.yml
    job: build
  - context: Test
    producedBy: .github/workflows/build.yml
    job: test
  - context: Inspect code
    producedBy: .github/workflows/build.yml
    job: inspectCode
  - context: Verify plugin
    producedBy: .github/workflows/build.yml
    job: verify
  - context: Lint workflows
    producedBy: .github/workflows/workflow-lint.yml
    job: lint

# Jobs that are deliberately NOT required contexts, and why - so a reviewer doesn't "fix" this
# file by adding them.
excludedFromRequiredChecks:
  - job: build.yml#releaseDraft
    reason: >-
      Guarded by `if: github.event_name != 'pull_request'`; it never runs on a pull_request
      event, so it can never satisfy a required-check gate for a PR.
  - workflow: release.yml
    reason: >-
      Runs only on a published GitHub Release event, never on a pull_request; publication
      trust-boundary policy for this workflow belongs to the release-provenance track (#56).

# Trust-boundary invariants this repository's workflows must maintain. Enforced automatically by
# `.github/workflow-policy/check_trust_boundary.py` (rules R1/R2) and by zizmor, wired into
# `.github/workflows/workflow-lint.yml`; restated here so the policy itself - not just its
# enforcement mechanism - is discoverable in one place.
trustBoundary:
  rules:
    - id: R1
      statement: >-
        A job must never hold contents:write, checks:write, or pull-requests:write while
        checking out github.event.pull_request.head.* (PR-authored source rather than the
        synthetic merge ref).
    - id: R2
      statement: >-
        A job holding none of contents:write, checks:write, or pull-requests:write (a
        "validation job") must set persist-credentials:false on every actions/checkout step.
    - id: pins
      statement: >-
        Every `uses:` reference must be pinned to a full 40-hex-character commit SHA, never a
        floating tag or branch.
  workflowDefault: contents:read
  privilegedJobs:
    - workflow: .github/workflows/build.yml
      job: releaseDraft
      permissions: [ contents:write ]
      justification: >-
        Creates/replaces a draft GitHub Release from main after all validation jobs pass.
        Never runs for a pull_request event (see excludedFromRequiredChecks above).
    - workflow: .github/workflows/release.yml
      job: release
      permissions: [ contents:write, pull-requests:write ]
      justification: >-
        Publishes to JetBrains Marketplace and opens the post-release changelog PR, triggered
        only by a maintainer publishing a GitHub Release. Governed by the release-provenance
        track (#56), not this policy's requiredStatusChecks.

labels:
  taxonomy:
    - name: dependencies
      description: Automated dependency update (Dependabot).
    - name: github_actions
      description: Dependabot update to a GitHub Actions workflow dependency.
  automation: >-
    Applied by .github/dependabot.yml's `labels:` keys on the PRs it opens. No other
    label-creation automation exists in this repository; do not assume a workflow will
    create a label on demand unless it is listed here.
