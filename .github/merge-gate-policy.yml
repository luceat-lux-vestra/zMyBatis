# Canonical repository / merge-gate policy for zMyBatis.
#
# This is the single source of truth for what must be true before main advances.
# Scope: repository/CI trust-boundary policy owned by issue #59. JetBrains
# Marketplace publication/version provenance remains owned by issue #56.
#
# Live authority: repository ruleset `main protection` (ID `22024054`) is
# active on the default branch. It enforces deletion/non-fast-forward protection,
# linear history, squash-only PR merges, strict required checks, review-thread
# resolution, and no bypass actors. Keep this file aligned with live readback.

version: 1

mergeStrategy:
  allowed: [ squash ]
  requireBranchUpToDate: true
  requireLinearHistory: true

# Every required context must be produced unconditionally for every PR targeting
# main. Ordinary producers use pull_request; the audited metadata-only
# failure-triage producer explicitly uses pull_request_target.
requiredStatusChecks:
  - context: Build
    producedBy: .github/workflows/build.yml
    job: build
  - context: Test
    producedBy: .github/workflows/build.yml
    job: test
  - context: Inspect code
    producedBy: .github/workflows/build.yml
    job: inspectCode
  - context: Verify plugin
    producedBy: .github/workflows/build.yml
    job: verify
  - context: Lint workflows
    producedBy: .github/workflows/workflow-lint.yml
    job: lint
  - context: failure-triage
    producedBy: .github/workflows/failure-triage.yml
    job: failure-triage
    trigger: pull_request_target

excludedFromRequiredChecks:
  - workflow: release.yml
    reason: >-
      Runs only on a published GitHub Release event. Publication trust-boundary
      policy belongs to the separate release-provenance track (#56).

stagedRequiredChecks:
  - context: Dependency Review
    producedBy: .github/workflows/dependency-review.yml
    job: review
    promotion: >-
      Promote to requiredStatusChecks only after ordinary-PR reliability is
      proven and Dependency Graph support is live. Dependency Review is a
      PR-diff-scoped check with no merged-main producer; after promotion,
      fresh-read the checked-in required-status list and live main ruleset
      atomically instead of requiring a nonexistent main run.

advisoryChecks:
  - contexts: [ "CodeQL (actions)" ]
    producedBy: .github/workflows/codeql.yml
    disposition: advisory
    reason: >-
      Stable CodeQL Actions analysis complements but does not replace the
      required Qodana Inspect code authority. Java/Kotlin analysis is tracked
      separately in #181 because the stable extractor rejects Kotlin 2.4.20
      despite GitHub's published support table. Do not substitute a nightly
      scanner or downgrade Kotlin solely to make an advisory check green.

# Enforced by .github/workflow-policy/check_trust_boundary.py.
trustBoundary:
  rules:
    - id: R0
      statement: >-
        Every scanned job must have an explicit effective permissions
        declaration, inherited from an explicit workflow-level declaration or
        provided as a job-level override. Missing declarations must never fall
        back to mutable repository/organization GITHUB_TOKEN defaults.
    - id: R1
      statement: >-
        A job in a pull_request workflow must never hold any effective *:write
        permission while checking out source, unless the job is provably
        excluded from pull_request execution by one exact audited event-name
        condition. The sole audited exception is .github/workflows/codeql.yml
        job analyze with exactly security-events:write for code-scanning result
        upload; no repository-content write scope is permitted.
    - id: R2
      statement: >-
        A job with no effective write permission must set
        persist-credentials:false on every actions/checkout step.
    - id: pins
      statement: >-
        Every uses reference must be pinned to a full 40-hex-character commit
        SHA, never a floating tag or branch.
  workflowDefault: contents:read
  explicitPermissionsRequired: true
  privilegedJobs:
    - workflow: .github/workflows/release.yml
      job: release
      permissions: [ contents:write ]
      justification: >-
        Publishes the validated release artifact to JetBrains Marketplace and
        uploads that artifact to the already-published GitHub Release. This
        release-event-only workflow is governed by release-provenance issue #56.

labels:
  taxonomy:
    - name: dependencies
      description: Automated dependency update (Dependabot).
    - name: github_actions
      description: Dependabot update to a GitHub Actions workflow dependency.
    - name: type:bug
      description: Incorrect, unsafe, or regressed behavior.
    - name: type:feature
      description: New supported product capability.
    - name: type:security
      description: Security hardening or vulnerability work.
    - name: type:docs
      description: Documentation-only work.
    - name: type:research
      description: Research, design, ADR, or bounded spike.
    - name: type:task
      description: Implementation, maintenance, test, CI, release, track, or epic work.
  automation: >-
    Dependabot labels are applied by .github/dependabot.yml. Issue type labels
    are reconciled by .github/workflows/issue-metadata.yml from explicit
    repository-owned title prefixes only; arbitrary issue body/text is never
    classified heuristically.

liveSettingsAudit:
  workflow: .github/workflows/repository-settings-drift.yml
  scheduleCron: "23 2 * * *"
  manualSecurityAssertions:
    dependency_graph: true
    dependabot_alerts: true
    dependabot_security_updates: enabled
    secret_scanning: enabled
    secret_scanning_push_protection: enabled
    private_vulnerability_reporting: true
  repository:
    visibility: public
    archived: false
    default_branch: main
    allow_squash_merge: true
    allow_merge_commit: false
    allow_rebase_merge: false
    allow_auto_merge: false
    delete_branch_on_merge: true
    allow_update_branch: true
  ruleset:
    id: 22024054
    name: main protection
    target: branch
    source_type: Repository
    source: luceat-lux-vestra/zMyBatis
    enforcement: active
    ref_name:
      include: [ "~DEFAULT_BRANCH" ]
      exclude: []
    bypass_actors: []
    rule_types: [ deletion, non_fast_forward, required_linear_history, pull_request, required_status_checks ]
    status_check_integration_id: 15368
    pull_request:
      required_approving_review_count: 0
      dismiss_stale_reviews_on_push: true
      required_reviewers: []
      require_code_owner_review: false
      require_last_push_approval: false
      required_review_thread_resolution: true
      require_extra_approval_for_unattributed_changes: true
      allowed_merge_methods: [ squash ]
    required_status_checks:
      strict_required_status_checks_policy: true
      do_not_enforce_on_create: false
  publicationTagRuleset:
    name: publication tags
    target: tag
    source_type: Repository
    source: luceat-lux-vestra/zMyBatis
    enforcement: active
    ref_name:
      include: [ "refs/tags/v*" ]
      exclude: []
    bypass_actors: []
    rule_types: [ deletion, update ]
