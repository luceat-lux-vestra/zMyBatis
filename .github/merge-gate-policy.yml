# Canonical repository / merge-gate policy for zMyBatis.
#
# This is the single source of truth for what must be true before main advances.
# Scope: repository/CI trust-boundary policy owned by issue #59. JetBrains
# Marketplace publication/version provenance remains owned by issue #56.
#
# Live authority (read back 2026-09-05): repository ruleset `main protection`
# (ID `22024054`) is active on the default branch. It enforces deletion and
# non-fast-forward protection, required linear history, squash-only PR merges,
# strict required status checks, required thread resolution, and no bypass
# actors. Its required contexts are exactly the five entries below.
#
# Keep this checked-in policy aligned with the live rulesets.

version: 1

mergeStrategy:
  allowed: [ squash ]
  requireBranchUpToDate: true
  requireLinearHistory: true

# Every required context must be produced unconditionally for every ordinary
# pull_request targeting main. `check_required_contexts.py` verifies workflow/job
# existence, pull_request trigger presence, job name, absence of job-level if,
# and absence of paths/paths-ignore filters on required producers.
requiredStatusChecks:
  - context: Build
    producedBy: .github/workflows/build.yml
    job: build
  - context: Test
    producedBy: .github/workflows/build.yml
    job: test
  - context: Inspect code
    producedBy: .github/workflows/build.yml
    job: inspectCode
  - context: Verify plugin
    producedBy: .github/workflows/build.yml
    job: verify
  - context: Lint workflows
    producedBy: .github/workflows/workflow-lint.yml
    job: lint

excludedFromRequiredChecks:
  - workflow: release.yml
    reason: >-
      Runs only on a published GitHub Release event. Publication trust-boundary
      policy belongs to the separate release-provenance track (#56).

# Enforced by `.github/workflow-policy/check_trust_boundary.py`.
trustBoundary:
  rules:
    - id: R0
      statement: >-
        Every scanned job must have an explicit effective `permissions`
        declaration, inherited from an explicit workflow-level declaration or
        provided as a job-level override. Missing declarations must never fall
        back to mutable repository/organization GITHUB_TOKEN defaults.
    - id: R1
      statement: >-
        A job in a pull_request workflow must never hold any effective
        `*:write` permission while checking out source, unless the job is
        provably excluded from pull_request execution by one exact audited
        event-name condition. The default synthetic merge ref contains
        PR-controlled code, so the invariant is about code provenance rather
        than one checkout ref spelling.
    - id: R2
      statement: >-
        A job with no effective write permission must set
        `persist-credentials:false` on every actions/checkout step.
    - id: pins
      statement: >-
        Every `uses:` reference must be pinned to a full 40-hex-character
        commit SHA, never a floating tag or branch.
  workflowDefault: contents:read
  explicitPermissionsRequired: true
  privilegedJobs:
    - workflow: .github/workflows/release.yml
      job: release
      permissions: [ contents:write ]
      justification: >-
        Publishes the validated release artifact to JetBrains Marketplace and
        uploads that artifact to the already-published GitHub Release. This
        release-event-only workflow is governed by release-provenance issue #56.

labels:
  taxonomy:
    - name: dependencies
      description: Automated dependency update (Dependabot).
    - name: github_actions
      description: Dependabot update to a GitHub Actions workflow dependency.
  automation: >-
    Applied by `.github/dependabot.yml` to Dependabot PRs. No other
    label-creation automation exists in this repository.

# Recurring ownership for live repository/ruleset drift. `Lint workflows`
# statically proves this workflow still exists, runs on main+schedule, and
# invokes the fail-closed checker. The live checker performs GET-only API reads
# and validates both main governance and immutable publication-tag governance.
liveSettingsAudit:
  workflow: .github/workflows/repository-settings-drift.yml
  scheduleCron: "23 2 * * *"
  repository:
    visibility: public
    archived: false
    default_branch: main
    allow_squash_merge: true
    allow_merge_commit: false
    allow_rebase_merge: false
    allow_auto_merge: false
    delete_branch_on_merge: true
    allow_update_branch: true
  ruleset:
    id: 22024054
    name: main protection
    target: branch
    source_type: Repository
    source: luceat-lux-vestra/zMyBatis
    enforcement: active
    ref_name:
      include: [ "~DEFAULT_BRANCH" ]
      exclude: []
    bypass_actors: []
    rule_types: [ deletion, non_fast_forward, required_linear_history, pull_request, required_status_checks ]
    status_check_integration_id: 15368
    pull_request:
      required_approving_review_count: 0
      dismiss_stale_reviews_on_push: true
      required_reviewers: []
      require_code_owner_review: false
      require_last_push_approval: false
      required_review_thread_resolution: true
      require_extra_approval_for_unattributed_changes: true
      allowed_merge_methods: [ squash ]
    required_status_checks:
      strict_required_status_checks_policy: true
      do_not_enforce_on_create: false
  publicationTagRuleset:
    name: publication tags
    target: tag
    source_type: Repository
    source: luceat-lux-vestra/zMyBatis
    enforcement: active
    ref_name:
      include: [ "refs/tags/v*" ]
      exclude: []
    bypass_actors: []
    rule_types: [ deletion, update ]
