# Non-submitting compatibility probe for replacing GitHub-managed automatic
# Gradle dependency submission. This workflow NEVER submits dependency snapshots.
# It intentionally does not run on pushes to main. Do not enable submission until
# the owner disables managed Automatic Dependency Submission in GitHub Settings
# and the generated dependency graph has been compared against the baseline.
name: Dependency Graph Compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/dependency-graph-compatibility.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-graph-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare-ready-graph:
    name: Graph parity (${{ matrix.mode }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: no-cache-x64
            runner: ubuntu-latest
            java: "21"
            distribution: temurin
            cache-disabled: true
          - mode: shared-readonly-arm64
            runner: ubuntu-24.04-arm
            java: "25"
            distribution: zulu
            cache-disabled: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PROBE_MODE: ${{ matrix.mode }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup managed-submission-compatible Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}

      - name: Generate graph without GitHub Actions caches or graph submission
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ matrix.cache-disabled }}
          cache-read-only: true
          dependency-graph: generate-and-upload
          dependency-graph-continue-on-failure: false
          artifact-retention-days: 1

      - name: Verify resolved dependency graph payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          reports = list(Path("dependency-graph-reports").glob("*.json"))
          if len(reports) != 1:
              raise SystemExit(f"Expected exactly one graph report, got {len(reports)}: {reports}")

          snapshot = json.loads(reports[0].read_text(encoding="utf-8"))
          manifests = snapshot.get("manifests")
          if not isinstance(manifests, dict) or len(manifests) == 0:
              raise SystemExit("Dependency graph contains no manifests")

          resolved = {}
          for manifest in manifests.values():
              resolved.update(manifest.get("resolved", {}))

          # Prior full GitHub-managed main graph: 761 resolved nodes, 67 direct.
          # This is a large-loss guard, not yet a proof of full graph parity.
          if len(resolved) < 650:
              raise SystemExit(f"Dependency graph lost substantial coverage: {len(resolved)} < 650")
          required = {
              "org.mybatis:mybatis:3.5.19",
              "org.jetbrains.intellij.platform:intellij-platform-gradle-plugin:2.19.0",
          }
          missing = required - resolved.keys()
          if missing:
              raise SystemExit(f"Missing required dependency graph nodes: {sorted(missing)}")

          direct = sum(
              data.get("relationship") == "direct"
              for data in resolved.values()
          )
          print(f"GRAPH_PROBE_MODE={__import__('os').environ['PROBE_MODE']}")
          print(f"GRAPH_PROBE_NO_SUBMISSION=1")
          print(f"GRAPH_PROBE_MANIFESTS={len(manifests)}")
          print(f"GRAPH_PROBE_NODES={len(resolved)}")
          print(f"GRAPH_PROBE_DIRECT={direct}")
          print(f"GRAPH_PROBE_REPORT={reports[0]}")
          with Path(__import__('os').environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write(
                  f"Dependency graph (generated, not submitted): "
                  f"{len(manifests)} manifests, {len(resolved)} nodes, "
                  f"{direct} direct. GitHub Actions cache disabled.\n"
              )
          PY
