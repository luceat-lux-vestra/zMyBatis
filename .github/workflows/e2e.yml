name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "docs/*.md"
      - "docs/**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  starterDriver:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Starter / Driver E2E
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Research-only overlap of the pinned IDEA archive install with existing
      # Java/Gradle/package/EGL work. No persistent cache or additional runner.
      - name: Start pinned IDEA installer prefetch
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/zmybatis-idea-prefetch"
          mkdir -p "$root"
          cat > "$root/worker.sh" <<'PREFETCH_WORKER'
          #!/usr/bin/env bash
          set -euo pipefail
          root="$RUNNER_TEMP/zmybatis-idea-prefetch"
          status="$root/status"
          trap 'rc=$?; printf "%s\n" "$rc" >"$root/status.tmp"; mv -f "$root/status.tmp" "$status"' EXIT
          url="https://download.jetbrains.com/idea/idea-2026.2.3-aarch64.tar.gz"
          installer="$GITHUB_WORKSPACE/out/ide-tests/installers/IU/ideaIU-262.10968.63-aarch64.tar.gz"
          build_dir="$GITHUB_WORKSPACE/out/ide-tests/cache/builds/IU-262.10968.63"
          stage="$root/unpacked"
          archive="$root/archive.part"
          test "$(uname -m)" = aarch64
          # JetBrains publishes the official checksum beside the pinned installer.
          checksum="$(curl -fLsS --retry 1 --max-time 25 "$url.sha256" | grep -Eom1 '[[:xdigit:]]{64}' || true)"
          [[ "$checksum" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "Official IDEA checksum unavailable"; exit 1; }
          curl -fLsS --retry 1 --max-time 110 "$url" -o "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum -c --status
          mkdir -p "$stage"
          tar -xzf "$archive" -C "$stage"
          test "$(find "$stage" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          app="$(find "$stage" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -f "$app/build.txt"
          grep -Fxq 'IU-262.10968.63' "$app/build.txt"
          test -x "$app/bin/idea" || test -x "$app/bin/idea.sh"
          mkdir -p "$(dirname "$installer")" "$(dirname "$build_dir")"
          test ! -e "$installer" && test ! -e "$build_dir"
          # Publish only verified complete objects, then Starter's stock
          # StandardInstaller skips its own download and extraction.
          mv "$archive" "$installer"
          mv "$stage" "$build_dir"
          echo "IDEA_PREFETCH_PUBLISHED=1"
          PREFETCH_WORKER
          nohup bash "$root/worker.sh" >"$root/worker.log" 2>&1 </dev/null &
          echo "$!" >"$root/pid"

      - name: Setup Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build exact plugin artifact
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 buildPlugin

          mapfile -t archives < <(find build/distributions -maxdepth 1 -type f -name '*.zip' -print)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one plugin distribution, found ${#archives[@]}"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi

          tested_commit="$(git rev-parse HEAD)"
          artifact="${archives[0]}"
          artifact_sha256="$(sha256sum "$artifact" | awk '{print $1}')"
          {
            echo "tested_commit=$tested_commit"
            echo "workflow_sha=$GITHUB_SHA"
            echo "java_target=25"
            echo "ide_release=2026.2.3"
            echo "plugin_artifact=$artifact"
            echo "plugin_sha256=$artifact_sha256"
          } | tee e2e-artifact-manifest.txt

      - name: Install ARM64 EGL runtime for IntelliJ Skiko
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libegl1
          ldconfig -p | grep -F 'libEGL.so.1'

      - name: Read back pinned IDEA installer prefetch
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/zmybatis-idea-prefetch"
          for i in $(seq 1 120); do
            test -f "$root/status" && break
            sleep 1
          done
          if ! test -f "$root/status"; then
            echo "::error::IDE prefetch worker did not finish; do not run Starter against a potentially incomplete installation"
            exit 1
          fi
          if test "$(cat "$root/status")" = 0; then
            test -s "$GITHUB_WORKSPACE/out/ide-tests/installers/IU/ideaIU-262.10968.63-aarch64.tar.gz"
            test -d "$GITHUB_WORKSPACE/out/ide-tests/cache/builds/IU-262.10968.63"
            echo "IDEA_PREFETCH=HIT"
          else
            # No partially downloaded/extracted IDEA was published. Full real
            # Starter suite falls back to vendor downloader/installer unchanged.
            echo "::warning::IDEA prefetch not used; stock Starter will download/install the pinned release"
            tail -n 15 "$root/worker.log"
            echo "IDEA_PREFETCH=FALLBACK"
          fi

      - name: Run Starter / Driver E2E
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 integrationTest --stacktrace 2>&1 | tee e2e.log

      - name: Surface real-database IDE diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t logs < <(find out/ide-tests/tests -type f -path '*/action-real-database/log/idea.log' -print 2>/dev/null)
          if [[ ${#logs[@]} -eq 0 ]]; then
            echo "::warning::No action-real-database idea.log found"
            exit 0
          fi

          for log in "${logs[@]}"; do
            echo "===== $log ====="
            grep -E -i 'zMyBatis|com[.]algorist[.]zMyBatis|org[.]h2|jdbc:h2|SQLException|SQLState|JDBC|JdbcConsole|DatabaseDriver|DataSource|connection|driver' "$log" | tail -n 600 || true
          done

      - name: Upload E2E artifact identity
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-artifact-identity
          path: e2e-artifact-manifest.txt
          if-no-files-found: error

      - name: Upload E2E failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-failure-diagnostics
          path: |
            e2e.log
            build/reports/tests/integrationTest
            build/test-results/integrationTest
            out/ide-tests/tests
          if-no-files-found: warn
