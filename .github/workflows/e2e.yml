name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "docs/*.md"
      - "docs/**/*.md"
  # Same trusted-main cache owner as manual E2E; only actual Gradle inputs
  # schedule a bounded cache prime. Product-source merges do not launch E2E.
  push:
    branches: [main]
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '**/build.gradle.kts'
      - '**/settings.gradle.kts'
      - '**/gradle.properties'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  starterDriver:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    name: Starter / Driver E2E
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # A dependency-scoped main push or explicit main dispatch alone may
          # write. Forks and all PR validation remain cache read-only.
          cache-read-only: ${{ github.ref != 'refs/heads/main' || (github.event_name != 'push' && github.event_name != 'workflow_dispatch') }}

      - name: Prime existing trusted-main Gradle cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # Reuse this E2E job's cache identity; never start the IDE E2E,
          # Qodana, or a competing Gradle cache writer on post-merge push.
          ./gradlew --no-daemon -Dorg.gradle.java.installations.fromEnv=JAVA_HOME buildPlugin :mybatis-engine:compileKotlin

      - name: Build exact plugin artifact
        if: ${{ github.event_name != 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA_HOME buildPlugin

          mapfile -t archives < <(find build/distributions -maxdepth 1 -type f -name '*.zip' -print)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one plugin distribution, found ${#archives[@]}"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi

          tested_commit="$(git rev-parse HEAD)"
          artifact="${archives[0]}"
          artifact_sha256="$(sha256sum "$artifact" | awk '{print $1}')"
          {
            echo "tested_commit=$tested_commit"
            echo "workflow_sha=$GITHUB_SHA"
            echo "java_target=25"
            echo "ide_release=2026.2.3"
            echo "plugin_artifact=$artifact"
            echo "plugin_sha256=$artifact_sha256"
          } | tee e2e-artifact-manifest.txt

      - name: Install ARM64 EGL runtime for IntelliJ Skiko
        if: ${{ github.event_name != 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libegl1
          ldconfig -p | grep -F 'libEGL.so.1'

      - name: Start pinned PostgreSQL E2E service
        if: ${{ github.event_name != 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm \
            --name zmybatis-postgres-e2e \
            -e POSTGRES_USER=zmybatis \
            -e POSTGRES_DB=zmybatis \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            postgres@sha256:0b2882c46a2b8d8e148431b333394348cf4d7f15aec6df7f17d51dc641e56cfa
          # The official image starts a temporary Unix-socket-only server during
          # initdb and then shuts it down before launching the final TCP server. Waiting
          # without -h can therefore produce a false-ready race. Require the final TCP
          # listener and a real query through that listener.
          for attempt in $(seq 1 60); do
            if docker exec zmybatis-postgres-e2e               pg_isready -h 127.0.0.1 -U zmybatis -d zmybatis >/dev/null &&
              docker exec zmybatis-postgres-e2e                 psql -h 127.0.0.1 -U zmybatis -d zmybatis -Atc 'select 1' | grep -qx '1'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs zmybatis-postgres-e2e
              exit 1
            fi
            sleep 1
          done
          docker exec zmybatis-postgres-e2e             psql -h 127.0.0.1 -U zmybatis -d zmybatis -Atc 'select version()'

      - name: Run Starter / Driver E2E
        if: ${{ github.event_name != 'push' }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA_HOME integrationTest --stacktrace 2>&1 | tee e2e.log

      - name: Surface real-database IDE diagnostics
        if: ${{ failure() && github.event_name != 'push' }}
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t logs < <(find out/ide-tests/tests -type f \( -path '*/action-real-database/log/idea.log' -o -path '*/action-postgresql-bigint/log/idea.log' \) -print 2>/dev/null)
          if [[ ${#logs[@]} -eq 0 ]]; then
            echo "::warning::No real-database/PostgreSQL idea.log found"
            exit 0
          fi

          for log in "${logs[@]}"; do
            echo "===== $log ====="
            grep -E -i 'zMyBatis|com[.]algorist[.]zMyBatis|org[.]h2|jdbc:h2|org[.]postgresql|jdbc:postgresql|SQLException|SQLState|JDBC|JdbcConsole|DatabaseDriver|DataSource|connection|driver|Query History' "$log" | tail -n 900 || true
          done

      - name: Upload E2E artifact identity
        if: ${{ always() && github.event_name != 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-artifact-identity
          path: e2e-artifact-manifest.txt
          if-no-files-found: error

      - name: Upload E2E failure diagnostics
        if: ${{ failure() && github.event_name != 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-failure-diagnostics
          # Preserve actionable test/IDE evidence without archiving the entire
          # Starter test tree (which includes downloaded/runtime bulk data).
          path: |
            e2e.log
            build/reports/tests/integrationTest
            build/test-results/integrationTest
            out/ide-tests/tests/**/log/idea.log
            out/ide-tests/tests/**/screenshots/**
          if-no-files-found: warn
