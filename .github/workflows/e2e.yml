name: E2E

on:
  # PR execution is owned by the canonical Build DAG via workflow_call.
  workflow_call:
    inputs:
      candidate_artifact_name:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      candidate_version:
        required: true
        type: string
      candidate_sha256:
        required: true
        type: string
  # Same trusted-main cache owner as manual E2E; only actual Gradle inputs
  # schedule a bounded cache prime. Product-source merges do not launch E2E.
  push:
    branches: [main]
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '**/build.gradle.kts'
      - '**/settings.gradle.kts'
      - '**/gradle.properties'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  # Keep a distinct identity when invoked from Build; github.workflow in a called
  # workflow resolves to the caller and must not cancel its own parent run.
  group: zmybatis-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read # Read the exact candidate artifact produced earlier in the same Build run.
  contents: read

jobs:
  starterDriver:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    name: Starter / Driver E2E
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 75
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: 25
          check-latest: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # A dependency-scoped main push or explicit main dispatch alone may
          # write. Forks and all PR validation remain cache read-only.
          cache-read-only: ${{ github.ref != 'refs/heads/main' || (github.event_name != 'push' && github.event_name != 'workflow_dispatch') }}

      - name: Prime existing trusted-main Gradle cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # Reuse this E2E job's cache identity; never start the IDE E2E,
          # Qodana, or a competing Gradle cache writer on post-merge push.
          ./gradlew --no-daemon -Dorg.gradle.java.installations.fromEnv=JAVA_HOME buildPlugin :mybatis-engine:compileKotlin

      - name: Resolve exact validation candidate
        if: ${{ github.event_name != 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          EXPECTED_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test -n "$EXPECTED_ARTIFACT_NAME"
            test -n "$EXPECTED_CANDIDATE_SHA"
            test -n "$EXPECTED_CANDIDATE_VERSION"
            test -n "$EXPECTED_CANDIDATE_SHA256"
            test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"

            candidate_dir="$RUNNER_TEMP/zmybatis-validation-candidate"
            rm -rf "$candidate_dir"
            mkdir -p "$candidate_dir"
            gh run download "$GITHUB_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$EXPECTED_ARTIFACT_NAME" \
              --dir "$candidate_dir"

            mapfile -t manifests < <(find "$candidate_dir" -type f -name 'validation-candidate-manifest.txt' -print)
            mapfile -t archives < <(find "$candidate_dir" -type f -name '*.zip' -print)
            test "${#manifests[@]}" -eq 1
            test "${#archives[@]}" -eq 1
            manifest="${manifests[0]}"
            artifact="$(realpath "${archives[0]}")"

            manifest_value() { sed -n "s/^$1=//p" "$manifest"; }
            test "$(manifest_value candidate_sha)" = "$EXPECTED_CANDIDATE_SHA"
            test "$(manifest_value candidate_version)" = "$EXPECTED_CANDIDATE_VERSION"
            test "$(manifest_value plugin_artifact)" = "$(basename "$artifact")"
            test "$(manifest_value plugin_sha256)" = "$EXPECTED_CANDIDATE_SHA256"
            actual_sha256="$(sha256sum "$artifact" | awk '{print $1}')"
            test "$actual_sha256" = "$EXPECTED_CANDIDATE_SHA256"
            candidate_sha="$EXPECTED_CANDIDATE_SHA"
            candidate_version="$EXPECTED_CANDIDATE_VERSION"
            candidate_artifact_name="$EXPECTED_ARTIFACT_NAME"
          else
            candidate_sha="$(git rev-parse HEAD)"
            candidate_version="0.0.0-validation.sha${candidate_sha:0:12}"
            ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA_HOME buildPlugin -PpluginVersion="$candidate_version"
            mapfile -t archives < <(find build/distributions -maxdepth 1 -type f -name '*.zip' -print)
            test "${#archives[@]}" -eq 1
            artifact="$(realpath "${archives[0]}")"
            actual_sha256="$(sha256sum "$artifact" | awk '{print $1}')"
            candidate_artifact_name="standalone-local-build"
          fi

          echo "ZMYBATIS_E2E_PLUGIN_ARCHIVE=$artifact" >> "$GITHUB_ENV"
          echo "ZMYBATIS_E2E_CANDIDATE_VERSION=$candidate_version" >> "$GITHUB_ENV"
          {
            echo "tested_commit=$candidate_sha"
            echo "workflow_sha=$GITHUB_SHA"
            echo "candidate_version=$candidate_version"
            echo "candidate_artifact_name=$candidate_artifact_name"
            echo "java_target=25"
            echo "ide_release=2026.3"
            echo "plugin_artifact=$(basename "$artifact")"
            echo "plugin_sha256=$actual_sha256"
          } | tee e2e-artifact-manifest.txt

      - name: Install ARM64 EGL runtime for IntelliJ Skiko
        if: ${{ github.event_name != 'push' }}
        shell: bash
        run: |
          bash .github/scripts/install-arm64-egl.sh

      - name: Start pinned PostgreSQL E2E service
        if: ${{ github.event_name != 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm \
            --name zmybatis-postgres-e2e \
            -e POSTGRES_USER=zmybatis \
            -e POSTGRES_DB=zmybatis \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            postgres@sha256:0b2882c46a2b8d8e148431b333394348cf4d7f15aec6df7f17d51dc641e56cfa
          # The official image starts a temporary Unix-socket-only server during
          # initdb and then shuts it down before launching the final TCP server. Waiting
          # without -h can therefore produce a false-ready race. Require the final TCP
          # listener and a real query through that listener.
          for attempt in $(seq 1 60); do
            if docker exec zmybatis-postgres-e2e               pg_isready -h 127.0.0.1 -U zmybatis -d zmybatis >/dev/null &&
              docker exec zmybatis-postgres-e2e                 psql -h 127.0.0.1 -U zmybatis -d zmybatis -Atc 'select 1' | grep -qx '1'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs zmybatis-postgres-e2e
              exit 1
            fi
            sleep 1
          done
          docker exec zmybatis-postgres-e2e             psql -h 127.0.0.1 -U zmybatis -d zmybatis -Atc 'select version()'

      - name: Run PostgreSQL native materialization proof
        if: ${{ github.event_name != 'push' }}
        env:
          ZMYBATIS_POSTGRES_MATERIALIZATION_RUNTIME: "1"
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA_HOME postgresMaterializationRuntimeTest --stacktrace 2>&1 | tee postgres-materialization.log

      - name: Run Starter / Driver E2E
        if: ${{ github.event_name != 'push' }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA_HOME integrationTest --stacktrace 2>&1 | tee e2e.log

      - name: Surface real-database IDE diagnostics
        if: ${{ failure() && github.event_name != 'push' }}
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t logs < <(find out/ide-tests/tests -type f \( -path '*/action-real-database/log/idea.log' -o -path '*/action-postgresql-bigint/log/idea.log' \) -print 2>/dev/null)
          if [[ ${#logs[@]} -eq 0 ]]; then
            echo "::warning::No real-database/PostgreSQL idea.log found"
            exit 0
          fi

          for log in "${logs[@]}"; do
            echo "===== $log ====="
            grep -E -i 'zMyBatis|com[.]algorist[.]zMyBatis|org[.]h2|jdbc:h2|org[.]postgresql|jdbc:postgresql|SQLException|SQLState|JDBC|JdbcConsole|DatabaseDriver|DataSource|connection|driver|Query History' "$log" | tail -n 900 || true
          done

      - name: Upload E2E artifact identity
        if: ${{ always() && github.event_name != 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-artifact-identity
          path: e2e-artifact-manifest.txt
          if-no-files-found: error

      - name: Upload E2E failure diagnostics
        if: ${{ failure() && github.event_name != 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-failure-diagnostics
          # Preserve actionable test/IDE evidence without archiving the entire
          # Starter test tree (which includes downloaded/runtime bulk data).
          path: |
            e2e.log
            postgres-materialization.log
            build/reports/tests/integrationTest
            build/test-results/integrationTest
            build/reports/tests/postgresMaterializationRuntimeTest
            build/test-results/postgresMaterializationRuntimeTest
            out/ide-tests/tests/**/log/idea.log
            out/ide-tests/tests/**/screenshots/**
          if-no-files-found: warn
  dataGripStarterDriver:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    name: Starter / Driver E2E (DataGrip)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: 25
          check-latest: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # DataGrip evidence is never a protected-main cache writer. Keep the existing
          # starterDriver job as the single trusted cache owner.
          cache-read-only: true

      - name: Resolve exact validation candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          EXPECTED_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test -n "$EXPECTED_ARTIFACT_NAME"
            test -n "$EXPECTED_CANDIDATE_SHA"
            test -n "$EXPECTED_CANDIDATE_VERSION"
            test -n "$EXPECTED_CANDIDATE_SHA256"
            test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"

            candidate_dir="$RUNNER_TEMP/zmybatis-validation-candidate"
            rm -rf "$candidate_dir"
            mkdir -p "$candidate_dir"
            gh run download "$GITHUB_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$EXPECTED_ARTIFACT_NAME" \
              --dir "$candidate_dir"

            mapfile -t manifests < <(find "$candidate_dir" -type f -name 'validation-candidate-manifest.txt' -print)
            mapfile -t archives < <(find "$candidate_dir" -type f -name '*.zip' -print)
            test "${#manifests[@]}" -eq 1
            test "${#archives[@]}" -eq 1
            manifest="${manifests[0]}"
            artifact="$(realpath "${archives[0]}")"

            manifest_value() { sed -n "s/^$1=//p" "$manifest"; }
            test "$(manifest_value candidate_sha)" = "$EXPECTED_CANDIDATE_SHA"
            test "$(manifest_value candidate_version)" = "$EXPECTED_CANDIDATE_VERSION"
            test "$(manifest_value plugin_artifact)" = "$(basename "$artifact")"
            test "$(manifest_value plugin_sha256)" = "$EXPECTED_CANDIDATE_SHA256"
            actual_sha256="$(sha256sum "$artifact" | awk '{print $1}')"
            test "$actual_sha256" = "$EXPECTED_CANDIDATE_SHA256"
            candidate_sha="$EXPECTED_CANDIDATE_SHA"
            candidate_version="$EXPECTED_CANDIDATE_VERSION"
            candidate_artifact_name="$EXPECTED_ARTIFACT_NAME"
          else
            candidate_sha="$(git rev-parse HEAD)"
            candidate_version="0.0.0-validation.sha${candidate_sha:0:12}"
            ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA_HOME buildPlugin -PpluginVersion="$candidate_version"
            mapfile -t archives < <(find build/distributions -maxdepth 1 -type f -name '*.zip' -print)
            test "${#archives[@]}" -eq 1
            artifact="$(realpath "${archives[0]}")"
            actual_sha256="$(sha256sum "$artifact" | awk '{print $1}')"
            candidate_artifact_name="standalone-local-build"
          fi

          echo "ZMYBATIS_E2E_PLUGIN_ARCHIVE=$artifact" >> "$GITHUB_ENV"
          {
            echo "tested_commit=$candidate_sha"
            echo "workflow_sha=$GITHUB_SHA"
            echo "candidate_version=$candidate_version"
            echo "candidate_artifact_name=$candidate_artifact_name"
            echo "java_target=25"
            echo "host=DATAGRIP"
            echo "ide_release=2026.3"
            echo "plugin_artifact=$(basename "$artifact")"
            echo "plugin_sha256=$actual_sha256"
          } | tee datagrip-e2e-artifact-manifest.txt

      - name: Install ARM64 EGL runtime for DataGrip Skiko
        shell: bash
        run: |
          bash .github/scripts/install-arm64-egl.sh

      - name: Start pinned PostgreSQL E2E service for DataGrip
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm \
            --name zmybatis-postgres-datagrip-e2e \
            -e POSTGRES_USER=zmybatis \
            -e POSTGRES_DB=zmybatis \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            postgres@sha256:0b2882c46a2b8d8e148431b333394348cf4d7f15aec6df7f17d51dc641e56cfa
          for attempt in $(seq 1 60); do
            if docker exec zmybatis-postgres-datagrip-e2e \
                pg_isready -h 127.0.0.1 -U zmybatis -d zmybatis >/dev/null &&
              docker exec zmybatis-postgres-datagrip-e2e \
                psql -h 127.0.0.1 -U zmybatis -d zmybatis -Atc 'select 1' | grep -qx '1'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs zmybatis-postgres-datagrip-e2e
              exit 1
            fi
            sleep 1
          done
          docker exec zmybatis-postgres-datagrip-e2e \
            psql -h 127.0.0.1 -U zmybatis -d zmybatis -Atc 'select version()'

      - name: Run DataGrip Starter / Driver E2E
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA_HOME dataGripIntegrationTest --stacktrace 2>&1 | tee datagrip-e2e.log

      - name: Upload DataGrip E2E artifact identity
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: datagrip-e2e-artifact-identity
          path: datagrip-e2e-artifact-manifest.txt
          if-no-files-found: error

      - name: Upload DataGrip E2E failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: datagrip-e2e-failure-diagnostics
          path: |
            datagrip-e2e.log
            build/reports/tests/dataGripIntegrationTest
            build/test-results/dataGripIntegrationTest
            out/ide-tests/tests/**/log/idea.log
            out/ide-tests/tests/**/screenshots/**
          if-no-files-found: warn

