# Phase 1 of #355: additive probe. Keep CodeQL push analysis intact until
# this trusted-main producer is proven and consumed by a subsequent PR.
name: Trusted Gradle Cache

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/trusted-gradle-cache.yml"
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "docs/*.md"
      - "docs/**/*.md"

permissions: {}

concurrency:
  group: trusted-gradle-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Preserve CodeQL Java/Kotlin matrix and job-id cache-key identity.
    name: Prime Gradle (java-kotlin)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # PR probe cannot mutate trusted-main cache entries.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Produce Java/Kotlin Gradle inputs
        run: ./gradlew --no-build-cache buildPlugin :mybatis-engine:compileKotlin -Dorg.gradle.jvmargs=-Xmx3g
