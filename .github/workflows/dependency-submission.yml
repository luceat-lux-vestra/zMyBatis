# Active replacement for GitHub-managed Automatic Dependency Submission (Gradle).
# Submit only on dependency-affecting protected-main changes or manual dispatch.
# Keep the cutover variable as a fail-closed safeguard, and Gradle cache read-only.
# Never run this publisher in parallel with managed ADS.
name: Gradle Dependency Submission

on:
  push:
    branches: [main]
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/gradle.properties'
      - '**/gradle.lockfile'
      - '**/gradle/dependency-locks/**'
      - '**/*.versions.toml'
      - 'gradle/**'
      - 'buildSrc/**'
      - 'build-logic/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/dependency-submission.yml'
      - '.github/workflow-policy/trusted_dependency_submission_validation.py'
  workflow_dispatch:

permissions: {}

concurrency:
  group: custom-gradle-dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submitGraph:
    name: Submit Gradle dependency graph
    if: ${{ github.repository == 'luceat-lux-vestra/zMyBatis' && github.ref == 'refs/heads/main' && vars.ZMYBATIS_ADS_CUTOVER_DONE == 'true' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout exact protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup supported Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: 25
          check-latest: true

      - name: Generate and submit exact main dependency graph (no cache writes)
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false

      - name: Verify submitted graph coverage and provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/workflow-policy/trusted_dependency_submission_validation.py verify-main \
            --dir dependency-graph-reports \
            --head "$GITHUB_SHA" \
            --catalog gradle/libs.versions.toml
