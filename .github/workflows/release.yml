# Publishing gate for zMyBatis.
#
# This is the ONLY workflow allowed to mutate release state or publish to JetBrains Marketplace.
# It runs exclusively off an already-published GitHub Release, i.e. a deliberate human action.
# PR validation (build.yml) must never create, delete, or modify releases.

name: Release

on:
  release:
    types: [ prereleased, released ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      # Publication must stop before signing/Marketplace side effects unless the
      # released tag identifies reviewed main history and all required credentials exist.
      - name: Verify release preconditions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${PUBLISH_TOKEN:-}" ] || missing+=("PUBLISH_TOKEN")
          [ -n "${CERTIFICATE_CHAIN:-}" ] || missing+=("CERTIFICATE_CHAIN")
          [ -n "${PRIVATE_KEY:-}" ] || missing+=("PRIVATE_KEY")
          [ -n "${PRIVATE_KEY_PASSWORD:-}" ] || missing+=("PRIVATE_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Release aborted before publication: missing secrets: ${missing[*]}"
            exit 1
          fi
          [ -n "${RELEASE_VERSION:-}" ] || { echo "::error::Release tag is empty."; exit 1; }

          tag_commit="$(git rev-list -n 1 "$RELEASE_VERSION")"
          head_commit="$(git rev-parse HEAD)"
          test "$tag_commit" = "$head_commit"

          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${RELEASE_VERSION}" --jq '.status')"
          case "$status" in
            identical|behind) ;;
            *)
              echo "::error::Release tag ${RELEASE_VERSION} is not reachable from main (status=${status})."
              exit 1 ;;
          esac

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Patch Changelog
        if: ${{ github.event.release.body != '' }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          printf '%s\n' "$CHANGELOG" > "$RELEASE_NOTE"
          ./gradlew patchChangelog -PbuildVersion="$RELEASE_VERSION" --release-note-file="$RELEASE_NOTE"

      # Construct and validate the exact release artifact before Marketplace publication.
      - name: Build and verify release artifact
        run: |
          set -euo pipefail
          ./gradlew buildPlugin -PbuildVersion="$RELEASE_VERSION"
          shopt -s nullglob
          artifacts=(./build/distributions/*.zip)
          if [ "${#artifacts[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one plugin distribution, found ${#artifacts[@]}."
            exit 1
          fi
          name="$(basename "${artifacts[0]}")"
          case "$name" in
            *"$RELEASE_VERSION"*) ;;
            *)
              echo "::error::Distribution ${name} does not contain release version ${RELEASE_VERSION}."
              exit 1 ;;
          esac

      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin -PbuildVersion="$RELEASE_VERSION"

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_VERSION" ./build/distributions/*

      - name: Create Pull Request
        if: ${{ github.event.release.body != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="changelog-update-$RELEASE_VERSION"
          LABEL="release changelog"

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          if git diff --quiet; then
            echo "Changelog already up to date for $RELEASE_VERSION; nothing to propose."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git commit -am "Changelog update - $RELEASE_VERSION"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$BRANCH"

          gh label create "$LABEL" \
            --description "Pull requests with release changelog update" \
            --force \
            || true

          gh pr create \
            --title "Changelog update - \`$RELEASE_VERSION\`" \
            --body "Current pull request contains patched \`CHANGELOG.md\` for the \`$RELEASE_VERSION\` version." \
            --label "$LABEL" \
            --base main \
            --head "$BRANCH"
