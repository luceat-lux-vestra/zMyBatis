# Publishes only a GitHub Release whose SemVer tag resolves to reviewed main history.
# The protected v-prefixed release tag is the publication identity; the effective JetBrains
# plugin version is the same SemVer with exactly the leading v removed.

name: Release

on:
  release:
    types: [ prereleased, released ]

permissions: {}

jobs:
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch tagged sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove release tag provenance
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python3 .github/workflow-policy/check_release_provenance.py tag "$RELEASE_TAG"
          TAG_COMMIT="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Build and verify exact release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PLUGIN_VERSION="${RELEASE_TAG#v}"
          ./gradlew clean buildPlugin verifyPlugin -PpluginVersion="$PLUGIN_VERSION"
          python3 .github/workflow-policy/check_release_provenance.py artifact "$RELEASE_TAG" build/distributions

      - name: Sign exact release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          PLUGIN_VERSION="${RELEASE_TAG#v}"
          ./gradlew signPlugin -PpluginVersion="$PLUGIN_VERSION"

      - name: Verify signed release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          PLUGIN_VERSION="${RELEASE_TAG#v}"
          ./gradlew verifyPluginSignature -PpluginVersion="$PLUGIN_VERSION"

      - name: Capture verified signed release asset
        id: signed_artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ARCHIVES < <(find build/distributions -maxdepth 1 -type f -name '*-signed.zip' -print)
          test "${#ARCHIVES[@]}" -eq 1
          sha256="$(sha256sum "${ARCHIVES[0]}" | awk '{print $1}')"
          {
            echo "path=${ARCHIVES[0]}"
            echo "name=$(basename "${ARCHIVES[0]}")"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Attest verified signed release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.signed_artifact.outputs.path }}

      - name: Publish exact release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          PLUGIN_VERSION="${RELEASE_TAG#v}"
          ./gradlew publishPlugin -x signPlugin -PpluginVersion="$PLUGIN_VERSION"

      - name: Recheck signed artifact identity after Marketplace publication
        env:
          RELEASE_ASSET: ${{ steps.signed_artifact.outputs.path }}
          EXPECTED_SHA256: ${{ steps.signed_artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum "$RELEASE_ASSET" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"

      - name: Upload validated release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ASSET: ${{ steps.signed_artifact.outputs.path }}
        run: gh release upload "$RELEASE_TAG" "$RELEASE_ASSET"
