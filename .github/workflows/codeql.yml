name: CodeQL
run-name: CodeQL source ${{ inputs.candidate_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character protected main SHA to scan"
        required: true
        type: string
  schedule:
    - cron: "47 3 * * 3"

permissions: {}

concurrency:
  group: codeql-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

jobs:
  scan-guard:
    name: CodeQL schedule guard
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      should_scan: ${{ steps.decide.outputs.should_scan }}
    steps:
      - name: Decide whether full CodeQL is required
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
            echo "Explicit candidate scan: always run full CodeQL."
            exit 0
          fi

          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Scheduled source is not an immutable SHA."
            exit 1
          }

          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml/runs?event=schedule&status=success&branch=main&per_page=100")"
          jq -e --arg sha "$GITHUB_SHA" --argjson current "$GITHUB_RUN_ID" '
            .workflow_runs
            | any(
                .id != $current
                and .head_sha == $sha
                and .head_branch == "main"
                and .path == ".github/workflows/codeql.yml"
              )
          ' <<<"$runs" >/dev/null && {
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
            echo "Protected main SHA $GITHUB_SHA already has a successful scheduled CodeQL run; skipping unchanged full scan."
            exit 0
          }

          echo "should_scan=true" >> "$GITHUB_OUTPUT"
          echo "No successful scheduled CodeQL run exists for protected main SHA $GITHUB_SHA; running full scan."

  analyze:
    needs: scan-guard
    if: needs.scan-guard.outputs.should_scan == 'true'
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
    steps:
      - name: Verify exact protected-main candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Exact 40-character SHA required"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::CodeQL must originate on main"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            [ "$GITHUB_SHA" = "$EXPECTED_SHA" ] || { echo "::error::Scheduled SHA mismatch"; exit 1; }
          fi
          case "$GITHUB_EVENT_NAME" in schedule|workflow_dispatch) ;; *) exit 1 ;; esac
          remote_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          # GitHub compare is against the actual protected main, not the dispatch event SHA.
          relation="$(gh api "repos/$GITHUB_REPOSITORY/compare/${EXPECTED_SHA}...${remote_main}" --jq '.status')"
          case "$relation" in ahead|identical) ;; *) echo "::error::Candidate is not protected main history"; exit 1 ;; esac

      - name: Fetch exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify protected-main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$EXPECTED_SHA" FETCH_HEAD

      - name: Record analyzed source
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          source = os.environ["EXPECTED_SHA"]
          checkout = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if source != checkout:
              raise SystemExit("Analyzed checkout diverges from selected source SHA")
          identity = {
              "schema": 1, "candidate_sha": source, "checkout_sha": checkout,
              "event_sha": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "language": os.environ["CODEQL_LANGUAGE"],
          }
          Path(os.environ["RUNNER_TEMP"], "source-identity.json").write_text(
              json.dumps(identity, sort_keys=True), encoding="utf-8")
          PY

      - name: Exercise SARIF verifier failure fixtures
        run: python3 .github/workflow-policy/check_codeql_sarif.py --self-test

      - name: Setup Java
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Preserve the existing ARM64 cache-family and read-only contract.
          cache-read-only: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Java/Kotlin for CodeQL
        if: ${{ matrix.language == 'java-kotlin' }}
        run: ./gradlew --no-build-cache buildPlugin :mybatis-engine:compileKotlin -Dorg.gradle.jvmargs=-Xmx3g

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
          upload: always
          output: ${{ runner.temp }}/codeql-${{ matrix.language }}

      - name: Retain unmodified original language SARIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-${{ env.EXPECTED_SHA }}-${{ matrix.language }}
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 90

      - name: Retain verified source provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-source-${{ env.EXPECTED_SHA }}-${{ matrix.language }}
          path: ${{ runner.temp }}/source-identity.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail closed on malformed or High/Critical SARIF
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/workflow-policy/check_codeql_sarif.py \
            --sarif-dir "$SARIF_DIR" \
            --language "${{ matrix.language }}" \
            --candidate-sha "$EXPECTED_SHA"
      - name: Verify protected-main ancestry after analysis
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$EXPECTED_SHA" FETCH_HEAD
