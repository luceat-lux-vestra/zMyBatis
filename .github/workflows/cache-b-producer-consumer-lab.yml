# Research only: cache-cohort B. Keep production CodeQL as the unchanged A control.
# The *same* workflow name, job id and matrix are used for trusted-main
# cache WRITE and untrusted PR read-only CodeQL analysis. Do not infer a
# successful A/B comparison until the B main-seeded entry is restored by a
# later PR, with its exact key in both job summaries.
name: Cache B Producer Consumer Lab

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/cache-b-producer-consumer-lab.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cache-b-producer-consumer-lab.yml"

permissions: {}

concurrency:
  group: cache-b-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Cache B Java/Kotlin
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle — strict B cohort
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-strict-match: true

      - name: Initialize PR CodeQL B diagnostic
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Produce or consume identical Java/Kotlin Gradle inputs
        run: ./gradlew --no-build-cache buildPlugin :mybatis-engine:compileKotlin -Dorg.gradle.jvmargs=-Xmx3g

      - name: Analyze PR CodeQL B locally
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/lab/cache-b/java-kotlin"
          upload: never
          output: ${{ runner.temp }}/cache-b-codeql-results

      - name: Retain experimental B SARIF without publishing duplicate alerts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-b-sarif-${{ github.run_id }}
          path: ${{ runner.temp }}/cache-b-codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 7
