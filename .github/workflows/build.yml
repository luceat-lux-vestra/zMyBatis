# Pull-request validation for the zMyBatis plugin.
#
# Gates, in dependency order:
# - build:       assembles the distributable plugin ZIP and keeps it as an artifact.
# - test:        root + core + mybatis-engine checks, including Kover coverage report generation.
# - qodanaScope: trusted-base fail-closed PR applicability decision.
# - inspectCode: stable evidence; full Qodana or deterministic non-applicable result.
# - dependencySubmissionValidation: read-only trusted-publisher compatibility fixture when applicable.
# - verify:      plugin structure verification + IntelliJ Plugin Verifier.
# - lint:        workflow/security/governance policy validation.
# - dependencyReview: pull-request dependency admission control.
# - starterDriver: reusable Starter/Driver E2E for ready non-documentation PRs.
# - mergeGate:   fail-closed aggregate over all required evidence jobs, including E2E when applicable.
#
# This workflow never creates release identity or publishes. SemVer release tags are selected
# explicitly outside ordinary CI and are consumed only by release.yml.

name: Build
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # Read the exact PR changed-file set for the bounded docs-only fast path.

jobs:
  prScope:
    name: PR scope
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Detect documentation-only scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "docs-only=false (non-PR validation)"
            exit 0
          fi

          changed="$RUNNER_TEMP/pr-changed-files.json"
          if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$changed"; then
            echo "::warning::Could not establish the changed-file set; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! jq -e '[.[][]] | length > 0' "$changed" >/dev/null; then
            echo "::warning::Changed-file set is empty or unreadable; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e '
            [ .[][] | .filename ] as $files
            | all($files[];
                . == "README.md"
                or . == "CONTRIBUTING.md"
                or . == "AGENTS.md"
                or test("^docs/.*[.]md$")
              )
          ' "$changed" >/dev/null; then
            docs_only=true
          else
            docs_only=false
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only=$docs_only"

  build:
    name: Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Detect documentation-only scope
        id: scope
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/pr-changed-files.json"

          if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$changed"; then
            echo "::warning::Could not establish the changed-file set; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! jq -e '[.[][]] | length > 0' "$changed" >/dev/null; then
            echo "::warning::Changed-file set is empty or unreadable; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e '
            [ .[][] | .filename ] as $files
            | all($files[];
                . == "README.md"
                or . == "CONTRIBUTING.md"
                or . == "AGENTS.md"
                or test("^docs/.*[.]md$")
              )
          ' "$changed" >/dev/null; then
            docs_only=true
          else
            docs_only=false
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only=$docs_only"

      - name: Documentation-only fast path
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        run: echo "Documentation-only change; product Build is not applicable."

      - name: Fetch Sources
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Main manual Build also runs Qodana; Gradle cache writes belong to E2E seed.
          cache-read-only: true

      - name: Build plugin
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: ./gradlew buildPlugin

      - name: Prepare Plugin Artifact
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/distributions"
          FILENAME=$(ls -- *.zip)
          unzip "$FILENAME" -d content
          echo "filename=${FILENAME%.zip}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ./build/distributions/content/*/*

  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Detect documentation-only scope
        id: scope
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/pr-changed-files.json"

          if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$changed"; then
            echo "::warning::Could not establish the changed-file set; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! jq -e '[.[][]] | length > 0' "$changed" >/dev/null; then
            echo "::warning::Changed-file set is empty or unreadable; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e '
            [ .[][] | .filename ] as $files
            | all($files[];
                . == "README.md"
                or . == "CONTRIBUTING.md"
                or . == "AGENTS.md"
                or test("^docs/.*[.]md$")
              )
          ' "$changed" >/dev/null; then
            docs_only=true
          else
            docs_only=false
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only=$docs_only"

      - name: Documentation-only fast path
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        run: echo "Documentation-only change; product Test is not applicable."

      - name: Fetch Sources
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Run Tests
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew check :core:check :mybatis-engine:check 2>&1 | tee gradle-check.log

      - name: Reject hidden IntelliJ test-harness failures
        if: ${{ steps.scope.outputs.docs_only != 'true' && always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradle-check.log ]]; then
            echo "::error::Gradle test log was not produced"
            exit 1
          fi
          if grep -E 'AsyncLog\.log|Worker exited due to exception|TestLoggerAssertionError|IllegalStateException: Check failed' gradle-check.log; then
            echo "::error::Hidden IntelliJ test-harness failure detected"
            exit 1
          fi

      - name: Collect Tests Result
        if: ${{ steps.scope.outputs.docs_only != 'true' && failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tests-result
          path: |
            ${{ github.workspace }}/build/reports/tests
            ${{ github.workspace }}/core/build/reports/tests
            ${{ github.workspace }}/mybatis-engine/build/reports/tests

      - name: Upload Coverage Artifact
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: ${{ github.workspace }}/build/reports/kover/report.xml
          if-no-files-found: error

  qodanaScope:
    name: Qodana scope
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      qodana_required: ${{ steps.scope.outputs.qodana_required }}
      qodana_reason: ${{ steps.scope.outputs.qodana_reason }}
      qodana_changed_count: ${{ steps.scope.outputs.qodana_changed_count }}
    steps:
      - name: Fetch trusted Qodana classifier policy
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-qodana-scope
          persist-credentials: false

      - name: Decide Qodana applicability
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            {
              echo "qodana_required=true"
              echo "qodana_reason=non-pr-full-scan"
              echo "qodana_changed_count=0"
            } >> "$GITHUB_OUTPUT"
            echo "Qodana scope decision: required=true reason=non-pr-full-scan"
            exit 0
          fi

          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::PR base SHA is not an exact 40-hex commit."
            exit 1
          }
          test "$(git -C .trusted-qodana-scope rev-parse HEAD)" = "$PR_BASE_SHA"
          classifier=".trusted-qodana-scope/.github/workflow-policy/classify_qodana_scope.py"
          test -f "$classifier"
          python3 "$classifier" --self-test

          changed="$RUNNER_TEMP/qodana-changed-files.json"
          if ! expected="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.changed_files')" \
             || ! [[ "$expected" =~ ^[0-9]+$ ]] \
             || ! gh api --paginate --slurp \
                  "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$changed"; then
            {
              echo "qodana_required=true"
              echo "qodana_reason=metadata-api-failure"
              echo "qodana_changed_count=0"
            } >> "$GITHUB_OUTPUT"
            echo "Qodana scope decision: required=true reason=metadata-api-failure"
            exit 0
          fi

          python3 "$classifier" \
            --input "$changed" \
            --expected-count "$expected" \
            --github-output "$GITHUB_OUTPUT"

  inspectCode:
    name: Inspect code
    needs: [ qodanaScope ]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Require valid Qodana scope decision
        env:
          QODANA_REQUIRED: ${{ needs.qodanaScope.outputs.qodana_required }}
          QODANA_REASON: ${{ needs.qodanaScope.outputs.qodana_reason }}
          QODANA_CHANGED_COUNT: ${{ needs.qodanaScope.outputs.qodana_changed_count }}
        shell: bash
        run: |
          set -euo pipefail
          case "$QODANA_REQUIRED" in
            true|false) ;;
            *)
              echo "::error::Invalid Qodana applicability decision: '$QODANA_REQUIRED'"
              exit 1
              ;;
          esac
          [[ "$QODANA_CHANGED_COUNT" =~ ^[0-9]+$ ]] || {
            echo "::error::Invalid Qodana changed-file count: '$QODANA_CHANGED_COUNT'"
            exit 1
          }
          test -n "$QODANA_REASON"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$QODANA_REQUIRED" != "true" ]; then
            echo "::error::Non-PR validation must perform full Qodana."
            exit 1
          fi
          if [ "$QODANA_REQUIRED" = "false" ]; then
            test "$GITHUB_EVENT_NAME" = "pull_request"
            test "$QODANA_REASON" = "all-paths-proven-non-qodana"
            [[ "$QODANA_CHANGED_COUNT" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::A non-applicable decision requires a non-empty changed-file set."
              exit 1
            }
          fi

      - name: Qodana not applicable
        if: ${{ github.event_name == 'pull_request' && needs.qodanaScope.outputs.qodana_required == 'false' }}
        env:
          QODANA_REASON: ${{ needs.qodanaScope.outputs.qodana_reason }}
          QODANA_CHANGED_COUNT: ${{ needs.qodanaScope.outputs.qodana_changed_count }}
        run: echo "Qodana full scan is not applicable ($QODANA_REASON; changed=$QODANA_CHANGED_COUNT)."

      - name: Fetch Sources
        if: ${{ needs.qodanaScope.outputs.qodana_required == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        if: ${{ needs.qodanaScope.outputs.qodana_required == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Qodana - Code Inspection
        if: ${{ needs.qodanaScope.outputs.qodana_required == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          args: --fail-threshold 0
          # Both keys must match across main and PR refs so PR analysis can restore
          # a trusted main cache; only the main workflow_dispatch run may write it.
          primary-cache-key: qodana-jvm-community-2026.2.2-linux-arm64-${{ github.sha }}
          additional-cache-key: qodana-jvm-community-2026.2.2-linux-arm64-
          cache-default-branch-only: true
          pr-mode: false
          upload-result: true
          artifact-name: qodana-report
          use-annotations: false
          post-pr-comment: false

  dependencySubmissionValidation:
    name: Dependency submission PR validation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fetch exact validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify dependency-submission PR adapter policy
        run: |
          python3 .github/workflow-policy/trusted_dependency_submission_validation.py self-test
          python3 .github/workflow-policy/trusted_dependency_submission_validation.py check-contract \
            --production .github/workflows/dependency-submission.yml \
            --pr-workflow .github/workflows/build.yml

      - name: Classify dependency-submission validation scope
        id: dependency-scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Dependency-submission PR validation is not applicable outside pull_request."
            exit 0
          fi

          pull="$RUNNER_TEMP/dependency-pr.json"
          files="$RUNNER_TEMP/dependency-pr-files.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$pull"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$files"
          python3 .github/workflow-policy/trusted_dependency_submission_validation.py classify \
            --pull "$pull" \
            --pages "$files" \
            --head "$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"

      - name: Setup supported Java
        if: ${{ steps.dependency-scope.outputs.required == 'true' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Generate untrusted PR dependency graph without submission
        if: ${{ steps.dependency-scope.outputs.required == 'true' }}
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          dependency-graph: generate-and-upload
          dependency-graph-report-dir: dependency-graph-reports-pr
          dependency-graph-continue-on-failure: false

      - name: Verify PR dependency graph provenance and coverage
        if: ${{ steps.dependency-scope.outputs.required == 'true' }}
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python3 .github/workflow-policy/trusted_dependency_submission_validation.py verify \
            --dir dependency-graph-reports-pr \
            --head "$EXPECTED_HEAD" \
            --event-ref "$EVENT_REF"


  verify:
    name: Verify plugin
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Detect documentation-only scope
        id: scope
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/pr-changed-files.json"

          if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$changed"; then
            echo "::warning::Could not establish the changed-file set; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! jq -e '[.[][]] | length > 0' "$changed" >/dev/null; then
            echo "::warning::Changed-file set is empty or unreadable; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e '
            [ .[][] | .filename ] as $files
            | all($files[];
                . == "README.md"
                or . == "CONTRIBUTING.md"
                or . == "AGENTS.md"
                or test("^docs/.*[.]md$")
              )
          ' "$changed" >/dev/null; then
            docs_only=true
          else
            docs_only=false
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only=$docs_only"

      - name: Documentation-only fast path
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        run: echo "Documentation-only change; Plugin Verifier is not applicable."

      - name: Fetch Sources
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Run Plugin Verification tasks
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        run: ./gradlew verifyPlugin

      - name: Collect Plugin Verifier Result
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier
  lint:
    name: Lint workflows
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require immutable action pins
        run: python3 .github/workflow-policy/check_pins.py .github/workflows

      - name: Require sound permission/credential trust boundaries
        run: python3 .github/workflow-policy/check_trust_boundary.py .github/workflows/*.yml

      - name: Require merge-gate-policy.yml to match its producing workflows
        run: python3 .github/workflow-policy/check_required_contexts.py .github/merge-gate-policy.yml .

      - name: Require fail-closed Qodana authority
        run: |
          python3 .github/workflow-policy/check_qodana_gate.py .github/workflows/build.yml qodana.yml
          python3 .github/workflow-policy/check_qodana_sarif.py --self-test

      - name: Verify Qodana PR scope classifier policy
        run: python3 .github/workflow-policy/classify_qodana_scope.py --self-test

      - name: Require recurring live-settings audit ownership
        run: python3 .github/workflow-policy/check_live_settings.py .github/merge-gate-policy.yml --static-only

      - name: Verify security release-preflight negative controls
        run: |
          python3 .github/workflow-policy/check_codeql_sarif.py --self-test
          python3 .github/workflow-policy/check_release_codeql.py --self-test
          python3 .github/workflow-policy/check_release_qodana.py --self-test

      - name: Require release provenance contract
        run: python3 .github/workflow-policy/check_release_provenance.py static .

      - name: Require authoritative governance contract
        run: python3 .github/workflow-policy/check_governance_contract.py .

      - name: Verify dependency-submission PR validation policy
        run: |
          python3 .github/workflow-policy/trusted_dependency_submission_validation.py self-test
          python3 .github/workflow-policy/trusted_dependency_submission_validation.py check-contract \
            --production .github/workflows/dependency-submission.yml \
            --pr-workflow .github/workflows/build.yml

      - name: Verify issue metadata policy
        run: |
          python3 .github/workflow-policy/test_issue_metadata.py
          node --test .github/workflow-policy/issue-metadata.test.cjs

      - name: Install actionlint
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          curl -fLsS -o actionlint_1.7.12_linux_arm64.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_arm64.tar.gz
          echo "325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6  actionlint_1.7.12_linux_arm64.tar.gz" | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_arm64.tar.gz actionlint
          ./actionlint -version

      - name: actionlint
        run: ./actionlint .github/workflows/*.yml

      - name: zizmor
        run: |
          set -euo pipefail
          pipx install "zizmor==1.30.0"
          zizmor --offline --persona regular .github/workflows/*.yml

      - name: Prove the checks above are actually fail-closed
        run: |
          python3 .github/workflow-policy/test_policy.py
          python3 .github/workflow-policy/test_qodana_gate.py
          python3 .github/workflow-policy/test_live_settings.py
          python3 .github/workflow-policy/test_release_provenance.py
          python3 .github/workflow-policy/test_governance_contract.py

  dependencyReview:
    name: Dependency Review
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

      - name: Non-PR validation placeholder
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "Dependency Review is pull-request-only; no dependency diff exists for manual dispatch."

  starterDriver:
    name: Starter / Driver E2E
    needs: [ prScope ]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.prScope.outputs.docs_only != 'true' }}
    uses: ./.github/workflows/e2e.yml

  mergeGate:
    name: Merge Gate
    needs: [ prScope, build, test, qodanaScope, inspectCode, dependencySubmissionValidation, verify, lint, dependencyReview, starterDriver ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require every merge-gate component to succeed
        env:
          PR_SCOPE_RESULT: ${{ needs.prScope.result }}
          PR_DOCS_ONLY: ${{ needs.prScope.outputs.docs_only }}
          E2E_RESULT: ${{ needs.starterDriver.result }}
          E2E_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.prScope.outputs.docs_only != 'true' }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          QODANA_SCOPE_RESULT: ${{ needs.qodanaScope.result }}
          INSPECT_RESULT: ${{ needs.inspectCode.result }}
          DEPENDENCY_SUBMISSION_VALIDATION_RESULT: ${{ needs.dependencySubmissionValidation.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependencyReview.result }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for entry in \
            "PR scope=$PR_SCOPE_RESULT" \
            "Build=$BUILD_RESULT" \
            "Test=$TEST_RESULT" \
            "Qodana scope=$QODANA_SCOPE_RESULT" \
            "Inspect code=$INSPECT_RESULT" \
            "Dependency submission PR validation=$DEPENDENCY_SUBMISSION_VALIDATION_RESULT" \
            "Verify plugin=$VERIFY_RESULT" \
            "Lint workflows=$LINT_RESULT" \
            "Dependency Review=$DEPENDENCY_REVIEW_RESULT"
          do
            name="${entry%%=*}"
            result="${entry#*=}"
            if [ "$result" != "success" ]; then
              echo "::error::$name concluded '$result'; Merge Gate remains closed."
              failed=1
            fi
          done

          case "$PR_DOCS_ONLY" in
            true|false) ;;
            *)
              echo "::error::PR scope emitted invalid docs-only value '$PR_DOCS_ONLY'."
              failed=1
              ;;
          esac

          if [ "$E2E_REQUIRED" = "true" ]; then
            if [ "$E2E_RESULT" != "success" ]; then
              echo "::error::Starter / Driver E2E concluded '$E2E_RESULT' but is required for this PR."
              failed=1
            fi
          elif [ "$E2E_RESULT" != "skipped" ]; then
            echo "::error::Starter / Driver E2E concluded '$E2E_RESULT' when it should be non-applicable."
            failed=1
          fi

          exit "$failed"
