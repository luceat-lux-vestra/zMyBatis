# PR and main validation for the zMyBatis plugin.
#
# Gates, in dependency order:
# - build:       assembles the distributable plugin ZIP and keeps it as an artifact.
# - test:        root + core + mybatis-engine checks, including Kover coverage report generation.
# - inspectCode: fail-closed full-repository Qodana static analysis.
# - verify:      plugin structure verification + IntelliJ Plugin Verifier.
#
# This workflow never creates release identity or publishes. SemVer release tags are selected
# explicitly outside ordinary CI and are consumed only by release.yml.

name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  # Read prior exact-SHA check results for Fast evidence reuse.
  checks: read
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Reuse exact-SHA Fast evidence
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_CHECK: Build
        run: |
          set -euo pipefail
          checks="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?filter=all&per_page=100")"
          current_run="/actions/runs/${GITHUB_RUN_ID}/"
          latest="$(jq -c --arg name "$EXPECTED_CHECK" --arg current_run "$current_run" '
            [.check_runs[]
             | select(.name == $name and .app.slug == "github-actions")
             | select(((.details_url // "") | contains($current_run)) | not)]
            | if length == 0 then empty else max_by(.id) end
          ' <<<"$checks")"
          if [ -z "$latest" ]; then
            echo "::error::No prior '$EXPECTED_CHECK' check exists for exact HEAD $EXPECTED_SHA."
            exit 1
          fi
          status="$(jq -r '.status' <<<"$latest")"
          conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "::error::Latest prior '$EXPECTED_CHECK' evidence for exact HEAD $EXPECTED_SHA is status=$status conclusion=$conclusion; refusing stale-success reuse."
            exit 1
          fi
          echo "Reused latest successful Fast evidence for $EXPECTED_CHECK at $EXPECTED_SHA."

      - name: Maximize Build Space
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' }}
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' }}
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build plugin
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' }}
        run: ./gradlew buildPlugin

      - name: Prepare Plugin Artifact
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' }}
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/distributions"
          FILENAME=$(ls -- *.zip)
          unzip "$FILENAME" -d content
          echo "filename=${FILENAME%.zip}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ./build/distributions/content/*/*

  test:
    name: Test
    needs: [ build ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Reuse exact-SHA Fast evidence
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_CHECK: Test
        run: |
          set -euo pipefail
          checks="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?filter=all&per_page=100")"
          current_run="/actions/runs/${GITHUB_RUN_ID}/"
          latest="$(jq -c --arg name "$EXPECTED_CHECK" --arg current_run "$current_run" '
            [.check_runs[]
             | select(.name == $name and .app.slug == "github-actions")
             | select(((.details_url // "") | contains($current_run)) | not)]
            | if length == 0 then empty else max_by(.id) end
          ' <<<"$checks")"
          if [ -z "$latest" ]; then
            echo "::error::No prior '$EXPECTED_CHECK' check exists for exact HEAD $EXPECTED_SHA."
            exit 1
          fi
          status="$(jq -r '.status' <<<"$latest")"
          conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "::error::Latest prior '$EXPECTED_CHECK' evidence for exact HEAD $EXPECTED_SHA is status=$status conclusion=$conclusion; refusing stale-success reuse."
            exit 1
          fi
          echo "Reused latest successful Fast evidence for $EXPECTED_CHECK at $EXPECTED_SHA."

      - name: Maximize Build Space
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' }}
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' }}
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Run Tests
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew check :core:check :mybatis-engine:check 2>&1 | tee gradle-check.log

      - name: Reject hidden IntelliJ test-harness failures
        if: ${{ (github.event_name != 'pull_request' || github.event.action != 'ready_for_review') && (always()) }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradle-check.log ]]; then
            echo "::error::Gradle test log was not produced"
            exit 1
          fi
          if grep -E 'AsyncLog\.log|Worker exited due to exception|TestLoggerAssertionError|IllegalStateException: Check failed' gradle-check.log; then
            echo "::error::Hidden IntelliJ test-harness failure detected"
            exit 1
          fi

      - name: Collect Tests Result
        if: ${{ (github.event_name != 'pull_request' || github.event.action != 'ready_for_review') && (failure()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tests-result
          path: |
            ${{ github.workspace }}/build/reports/tests
            ${{ github.workspace }}/core/build/reports/tests
            ${{ github.workspace }}/mybatis-engine/build/reports/tests

      - name: Upload Coverage Artifact
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: ${{ github.workspace }}/build/reports/kover/report.xml
          if-no-files-found: error

  inspectCode:
    name: Inspect code
    needs: [ build ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Maximize Build Space
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Qodana - Code Inspection
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: JetBrains/qodana-action@10be11607eb323a180e2b76b26c9c5cdceac3e77 # v2026.2.1
        with:
          args: --fail-threshold 0
          cache-default-branch-only: true
          pr-mode: false
          upload-result: true
          artifact-name: qodana-report
          use-annotations: false
          post-pr-comment: false

  verify:
    name: Verify plugin
    needs: [ build ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Maximize Build Space
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Run Plugin Verification tasks
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: ./gradlew verifyPlugin

      - name: Collect Plugin Verifier Result
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (always()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier
