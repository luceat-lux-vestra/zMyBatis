# PR validation and draft-release preparation for the zMyBatis plugin.
#
# Gates, in dependency order:
# - build:       assembles the distributable plugin ZIP and keeps it as an artifact.
# - test:        ./gradlew check (unit tests + Kover coverage upload).
# - inspectCode: Qodana static analysis of the exact PR head commit.
# - verify:      plugin structure verification + IntelliJ Plugin Verifier.
# - releaseDraft: on push to main only, stages (never publishes) a GitHub release draft.
#
# Trust boundary:
# - The workflow default is `contents: read`. Only `releaseDraft` - which never runs for a
#   pull_request event - is granted `contents: write`, to create/replace a release draft.
# - `inspectCode` checks out and builds PR-authored source, so it must never hold a writable
#   token: a pull_request from within this repo (private, no forks) could otherwise use a
#   PR to run privileged steps against its own writable GITHUB_TOKEN. It intentionally has no
#   `permissions:` block of its own and therefore inherits the read-only workflow default.
# - Every checkout sets `persist-credentials: false`; no job here needs an ambient git
#   credential (uploads/API calls use `secrets.GITHUB_TOKEN`/`secrets.CODECOV_TOKEN` directly).
# - Every third-party action is pinned to an immutable full-length commit SHA, enforced by
#   `.github/workflows/workflow-lint.yml`, not by this file.
#
# This workflow validates and, on main only, stages a draft. It must never publish to
# JetBrains Marketplace or otherwise mutate a released version - see release.yml.

name: Build
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Prepare Plugin Artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/distributions"
          FILENAME=$(ls -- *.zip)
          unzip "$FILENAME" -d content

          echo "filename=${FILENAME%.zip}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ./build/distributions/content/*/*

  test:
    name: Test
    needs: [ build ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Run Tests
        run: ./gradlew check

      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tests-result
          path: ${{ github.workspace }}/build/reports/tests

      - name: Upload Code Coverage Report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ${{ github.workspace }}/build/reports/kover/report.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # SECURITY: this job checks out and builds PR-authored source under Qodana. It must never
  # hold a writable token - see the trust-boundary note at the top of this file. It has no
  # `permissions:` block, so it inherits the read-only workflow default. One consequence: the
  # action can no longer publish its own PR comment or "Qodana Community for JVM" check run;
  # this job's own pass/fail conclusion is the authoritative signal.
  inspectCode:
    name: Inspect code
    needs: [ build ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Analyse the real PR commit, not the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history is required for Qodana's pull request analysis.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: zulu
          java-version: 21

      - name: Qodana - Code Inspection
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        with:
          cache-default-branch-only: true

  verify:
    name: Verify plugin
    needs: [ build ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Run Plugin Verification tasks
        run: ./gradlew verifyPlugin

      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier

  # Stages a draft GitHub Release for manual review. This never publishes to JetBrains
  # Marketplace (see release.yml) and never runs for a pull_request event, so the explicit
  # `contents: write` grant below cannot be reached from PR-authored code.
  releaseDraft:
    name: Release draft
    if: github.event_name != 'pull_request'
    needs: [ build, test, inspectCode, verify ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Remove Old Release Drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -r -I '{}' gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/{}"

      - name: Create Release Draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(./gradlew properties --property version --quiet --console=plain | tail -n 1 | cut -f2- -d ' ')
          RELEASE_NOTE="./build/tmp/release_note.txt"
          ./gradlew getChangelog --unreleased --no-header --quiet --console=plain --output-file="$RELEASE_NOTE"

          gh release create "$VERSION" \
            --draft \
            --title "$VERSION" \
            --notes-file "$RELEASE_NOTE"
