services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zmybatis
      POSTGRES_USER: zmybatis
      POSTGRES_PASSWORD: zmybatis
    ports:
      - "${ZMYBATIS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zmybatis -d zmybatis"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
